name: 🐛 Bug report
description: Сообщить об ошибке или некорректном поведении
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение об ошибке! Заполните, пожалуйста, форму ниже как можно подробнее.

  - type: textarea
    id: description
    attributes:
      label: Описание ошибки
      description: Краткое и ясное описание проблемы
      placeholder: Например, "При расчёте с ε₁=10 приложение зависает на этапе сборки матрицы"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Шаги воспроизведения
      description: Точные шаги для воспроизведения ошибки
      placeholder: |
        1. Открыть приложение по ссылке strip-dipole-cylinder.streamlit.app
        2. В сайдбаре выбрать пресет "Цилиндр с ε₁=5"
        3. Изменить ε₁ на 10
        4. Перейти на вкладку "Расчёт" → "Запустить"
        5. Через 60 секунд приложение зависает с ошибкой
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти?
      placeholder: Расчёт должен завершиться за разумное время с осмысленным результатом
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что произошло вместо этого?
      placeholder: Приложение зависло, в логах появилось OverflowError в функции Z11
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Где запускали?
      multiple: false
      options:
        - Streamlit Cloud (live demo)
        - Локально через Streamlit
        - Локально как Python-библиотека
        - Docker
        - Другое (опишите ниже)
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Версия Python
      description: Команда `python --version`
      placeholder: 3.11.4
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Операционная система
      placeholder: Windows 11 / Ubuntu 22.04 / macOS 14
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Версии зависимостей
      description: Вывод `pip freeze | grep -E "numpy|scipy|streamlit|plotly"`
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Логи / трассировка
      description: |
        Вставьте сообщение об ошибке или трассировку.
      render: python
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Скриншоты
      description: Если применимо, приложите скриншоты (можно перетащить файлы в это поле)
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Дополнительный контекст
      description: Любая другая полезная информация
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Подтверждение
      options:
        - label: Я проверил, что аналогичный issue ещё не открыт
          required: true
        - label: Я могу предоставить дополнительную информацию по запросу
          required: true
